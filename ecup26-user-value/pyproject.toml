[project]
name = "ecup26-user-value"
version = "0.1.0"
description = "E-CUP 2026 Task 3: User Value Prediction (GMV Forecasting)"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.6.0",
    "matplotlib>=3.10.0",
    "lifetimes>=0.11.3",
    "lightgbm>=4.7.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/"]

[tool.hatch.build.targets.wheel]
packages = ["src/ecup26_user_value"]

[dependency-groups]
dev = [
    "catboost>=1.2.10",
    "gplearn>=0.4.3",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "shap>=0.51.0",
    "torch>=2.13.0",
    "xgboost>=3.2.0",
]
